.29" y="159.659" fill="#000" font-size="11" textLength="219.742">(producto, cantidad, recorrido ajustado;</text><text x="435.413" y="172.463" fill="#000" font-size="11" textLength="185.496">asigna insumos y congela costos)</text></g><!--entity UC_qr--><g class="entity" data-qualified-name="Panel web.Lotes.UC_qr" id="ent0009" data-source-line="19"><ellipse cx="958.089" cy="230.442" rx="74.789" ry="20.475" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="905.487" y="227.855" fill="#000" font-size="11" textLength="105.204">Generar e imprimir</text><text x="913.611" y="240.659" fill="#000" font-size="11" textLength="88.956">etiqueta con QR</text></g><!--entity UC_tablero--><g class="entity" data-qualified-name="Panel web.Lotes.UC_tablero" id="ent0010" data-source-line="20"><ellipse cx="528.157" cy="243.444" rx="68.017" ry="20.467" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="480.494" y="240.869" fill="#000" font-size="11" textLength="95.326">Consultar tablero</text><text x="487.965" y="253.673" fill="#000" font-size="11" textLength="80.384">en tiempo real</text></g><!--entity UC_hist--><g class="entity" data-qualified-name="Panel web.Lotes.UC_hist" id="ent0011" data-source-line="21"><ellipse cx="958.095" cy="154.446" rx="90.745" ry="20.549" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="906.151" y="149.607" fill="#000" font-size="11" textLength="103.888">Consultar historial,</text><text x="891.668" y="162.412" fill="#000" font-size="11" textLength="132.854">bitácora y costo del lote</text></g><!--entity UC_conf--><g class="entity" data-qualified-name="Panel web.Lotes.UC_conf" id="ent0012" data-source-line="22"><ellipse cx="528.156" cy="324.442" rx="115.926" ry="25.585" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="460.827" y="315.615" fill="#000" font-size="11" textLength="134.659">Confirmar cierre del lote</text><text x="421.599" y="328.42" fill="#000" font-size="11" textLength="213.114">(piez